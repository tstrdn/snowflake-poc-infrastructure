name: Deploy

# Reusable deployment of one immutable configuration state to one environment.
#
# Called by release.yml for development (automatically) and by promote.yml for
# test and production (manually, behind a two-role approval - see promote.yml).
# All three paths run this identical job against the identical tagged ref, so
# a promotion is not a different process from a deployment - it is the same
# process pointed at a different account (P2). There is no per-environment
# version pin file: what is deployed is answered by which tag was checked out,
# by HCP Terraform's own run history, and by the version stamped into
# Snowflake at the end of this job (E5/E6).

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev, tst or prd)
        required: true
        type: string
      version:
        description: Configuration version to deploy (bare semver, no leading v)
        required: true
        type: string
      policy_override:
        description: >-
          Set to "warehouse-size" to acknowledge and proceed past a non-PROD
          warehouse-size policy violation (rule R4). Every other rule is
          non-overridable. Leave empty in the normal case.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    name: Apply ${{ inputs.version }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest

    # The gate. Reviewers configured on the tst and prd environments hold the
    # job here until someone approves. Development has no reviewers, so it
    # runs straight through. For tst/prd this job itself is only reached after
    # promote.yml's two sequential approval jobs have both passed (E17/E18) -
    # this "environment:" line is a second, independent lock, not the whole
    # control.
    environment: ${{ inputs.environment }}

    # HCP Terraform's free tier allows one concurrent run per organization, and
    # two applies against the same workspace would conflict regardless. Queue
    # rather than race.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      # The immutable tag, not a moving branch. Every environment that deploys
      # version X.Y.Z checks out the exact same tree - this is what makes "the
      # identical configuration state reaches every environment" (A10/A18/A24)
      # a property of the ref rather than a promise a script has to keep.
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/v${{ inputs.version }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      # Modules are local (E2/E3) - init only resolves the provider, no
      # registry credentials are needed on this runner.
      - name: terraform init
        working-directory: envs/${{ inputs.environment }}
        env:
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
        run: terraform init -input=false

      - name: terraform plan
        working-directory: envs/${{ inputs.environment }}
        env:
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
        run: |
          terraform plan -input=false -out=tfplan \
            -var="deploy_version=${{ inputs.version }}"
          terraform show -json tfplan > tfplan.json

      # G2, the CI-side implementation. This is NOT yet the server-side,
      # non-bypassable Sentinel/OPA check the target design calls for (spec
      # §5.3, §9.1) - it runs on this runner rather than inside Terraform
      # Enterprise, so it is only as trustworthy as this workflow file. It
      # stands in until the HCP organization's actual policy-set tier is
      # verified. See docs/decisions.md.
      - name: Policy check
        working-directory: envs/${{ inputs.environment }}
        env:
          POLICY_OVERRIDE: ${{ inputs.policy_override }}
        run: ../../.github/scripts/policy_check.sh tfplan.json ${{ inputs.environment }}

      # Applies the exact plan that was policy-checked above, not a freshly
      # computed one - what was reviewed is what runs.
      - name: terraform apply
        working-directory: envs/${{ inputs.environment }}
        env:
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
        run: terraform apply -input=false tfplan

      - name: Summarise
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## ${ENVIRONMENT} — configuration v${VERSION}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`${ENVIRONMENT}\` |"
            echo "| Version (tag) | \`v${VERSION}\` |"
            echo "| HCP workspace | \`snowflake-poc-${ENVIRONMENT}\` |"
            echo "| Result | ${{ job.status }} |"
            echo
            echo "What this environment is running can also be read directly from"
            echo "Snowflake: \`DESCRIBE DATABASE OPS\` on this account shows the"
            echo "deployed version in the comment (E6)."
          } >> "$GITHUB_STEP_SUMMARY"
