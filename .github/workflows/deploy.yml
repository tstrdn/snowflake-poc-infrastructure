name: Deploy

# Reusable deployment of one module version to one environment.
#
# Called by release.yml for development (automatically) and by promote.yml for
# test and production (manually, behind an approval gate). Both paths run this
# identical job, so a promotion is not a different process from a deployment -
# it is the same process pointed at a different account.

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev, tst or prd)
        required: true
        type: string
      version:
        description: Module set version to deploy
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    name: Apply ${{ inputs.version }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest

    # The gate. Reviewers configured on the tst and prd environments hold the
    # job here until someone approves. Development has no reviewers, so it
    # runs straight through.
    environment: ${{ inputs.environment }}

    # HCP Terraform's free tier allows one concurrent run per organization, and
    # two applies against the same workspace would conflict regardless. Queue
    # rather than race.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      # GH_PUSH_TOKEN, not the default GITHUB_TOKEN. The version pin is
      # committed back to a protected main, and github-actions[bot] cannot be
      # made a ruleset bypass actor on this account tier. actions/checkout
      # persists this credential, so the later push uses it too.
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - name: Pin ${{ inputs.environment }} to ${{ inputs.version }}
        id: pin
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          file="envs/${ENVIRONMENT}/modules.tf"

          sed -i -E "s|^(  version = )\"[^\"]+\"|\1\"${VERSION}\"|" "$file"

          if git diff --quiet -- "$file"; then
            echo "Already pinned to ${VERSION}; applying anyway to converge state."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff -- "$file"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record the deployment
        if: steps.pin.outputs.changed == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "envs/${ENVIRONMENT}/modules.tf"
          git commit -m "chore(${ENVIRONMENT}): deploy module set v${VERSION}"

          # Pushed with GH_PUSH_TOKEN, whose owner holds the Repository admin
          # role that the main branch ruleset lists as a bypass actor - see
          # docs/runbook-bootstrap.md. Without it the push is rejected and the
          # deployment record is lost, so fail loudly here rather than leaving
          # an applied version unrecorded.
          git push origin HEAD:main

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      # There is no separate "does this version exist" pre-flight. init resolves
      # the pinned module from the registry and fails here if it cannot - before
      # apply, so before anything in Snowflake changes. A hand-built existence
      # check duplicated this and was less reliable than the thing it guarded.
      - name: terraform init
        working-directory: envs/${{ inputs.environment }}
        env:
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
        run: terraform init -input=false

      - name: terraform apply
        working-directory: envs/${{ inputs.environment }}
        env:
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
        run: terraform apply -input=false -auto-approve

      - name: Summarise
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## ${ENVIRONMENT} — module set v${VERSION}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`${ENVIRONMENT}\` |"
            echo "| Module version | \`${VERSION}\` |"
            echo "| HCP workspace | \`snowflake-poc-${ENVIRONMENT}\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
