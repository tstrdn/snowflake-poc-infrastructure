name: Deploy

# Reusable deployment of one module version to one environment.
#
# Called by release.yml for development (automatically) and by promote.yml for
# test and production (manually, behind an approval gate). Both paths run this
# identical job, so a promotion is not a different process from a deployment -
# it is the same process pointed at a different account.

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev, tst or prd)
        required: true
        type: string
      version:
        description: Module set version to deploy
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    name: Apply ${{ inputs.version }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest

    # The gate. Reviewers configured on the tst and prd environments hold the
    # job here until someone approves. Development has no reviewers, so it
    # runs straight through.
    environment: ${{ inputs.environment }}

    # HCP Terraform's free tier allows one concurrent run per organization, and
    # two applies against the same workspace would conflict regardless. Queue
    # rather than race.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify the version exists in Artifactory
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        run: |
          # Fail before touching Snowflake if the requested version was never
          # published - otherwise terraform init fails with a much less
          # obvious error halfway through.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${JF_ACCESS_TOKEN}" \
            "${JF_URL%/}/artifactory/api/terraform/v1/snowflake-poc-tf-modules/snowflakepoc/snowflake-environment/snowflake/${{ inputs.version }}/download")

          if [ "$status" = "404" ]; then
            echo "::error::Module version ${{ inputs.version }} is not published in Artifactory."
            exit 1
          fi
          echo "Artifactory responded ${status} for version ${{ inputs.version }}."

      - name: Pin ${{ inputs.environment }} to ${{ inputs.version }}
        id: pin
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          file="envs/${ENVIRONMENT}/modules.tf"

          sed -i -E "s|^(  version = )\"[^\"]+\"|\1\"${VERSION}\"|" "$file"

          if git diff --quiet -- "$file"; then
            echo "Already pinned to ${VERSION}; applying anyway to converge state."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff -- "$file"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record the deployment
        if: steps.pin.outputs.changed == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "envs/${ENVIRONMENT}/modules.tf"
          git commit -m "chore(${ENVIRONMENT}): deploy module set v${VERSION}"

          # Requires the github-actions bot to be a bypass actor on the main
          # branch ruleset - see docs/runbook-bootstrap.md. Without it the push
          # is rejected and the deployment record is lost, so fail loudly here
          # rather than applying an unrecorded version.
          git push origin HEAD:main

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: envs/${{ inputs.environment }}
        env:
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
        run: terraform init -input=false

      - name: terraform apply
        working-directory: envs/${{ inputs.environment }}
        env:
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
        run: terraform apply -input=false -auto-approve

      - name: Summarise
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## ${ENVIRONMENT} — module set v${VERSION}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`${ENVIRONMENT}\` |"
            echo "| Module version | \`${VERSION}\` |"
            echo "| HCP workspace | \`snowflake-poc-${ENVIRONMENT}\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
