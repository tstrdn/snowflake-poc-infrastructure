name: Promote

# Manual promotion of an already-tagged configuration state to test or
# production. Also the rollback path: promoting an older tag is the same
# operation, which is exactly why there is no separate rollback workflow
# (P6, R2).
#
# ---------------------------------------------------------------------------
# No approval gate here by deliberate PoC scope decision.
#
# The process specification's target state (E17) calls for two-role approval
# on every promotion to TEST and PROD, and E18 records how that would be
# implemented - two sequential GitHub Environments per target environment,
# each with its own reviewer group and self-review disabled. That design is
# unchanged and still the intended end state; it is simply out of scope for
# this PoC, which promotes on the "deploy" GitHub Environment alone (whatever
# reviewer settings that carries, if any) and otherwise runs straight
# through. Re-adding the two-role chain removed here is the way back to
# E17/E18 once approver groups are decided (O9).
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - tst
          - prd
      version:
        description: Configuration version to deploy, e.g. 0.2.0 (no leading v)
        required: true
        type: string
      policy_override:
        description: >-
          Set to "warehouse-size" to acknowledge a non-PROD warehouse-size
          policy violation. Leave empty in the normal case. Recorded in this
          run's inputs either way, so an override is always auditable.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate-input:
    name: Check version and tag
    runs-on: ubuntu-latest
    steps:
      - name: Reject malformed versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'${VERSION}' is not a bare semver string. Use 0.2.0, not v0.2.0."
            exit 1
          fi

      # A promotion can only ever move a version that was actually released -
      # this cannot invent a deployment out of an arbitrary string. It does
      # not check that the version already ran in a lower environment first
      # (that ordering is not yet enforced anywhere - see the specification's
      # open design considerations), only that the tag is real.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Confirm the tag exists
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} does not exist. Nothing was ever released under this version."
            exit 1
          fi
          echo "Tag v${VERSION} confirmed."

  promote:
    name: Deploy
    needs: validate-input
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      version: ${{ inputs.version }}
      policy_override: ${{ inputs.policy_override }}
    secrets: inherit
