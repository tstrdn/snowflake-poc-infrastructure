name: Release

# Creates the protected, immutable version reference for this configuration
# state (A9 - a Git tag, not a published artifact). Terraform has no build
# step, so there is nothing to publish here: the tag *is* the version. See
# docs/decisions.md for why an artifact registry was dropped for this
# repository (E2/E3).
#
# There is no deploy-to-development job here anymore. The dev workspace is
# VCS-driven and tracks this branch directly (see docs/decisions.md) - TFE
# picks up this same push on its own, off this runner, the moment it lands.
# This workflow's only remaining job is the tag itself, which promote.yml
# later resolves to a commit when moving env/tst or env/prd.

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "envs/**"
      - "VERSION"
      - ".github/workflows/release.yml"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: Create the version tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # The tag is the idempotency guard and the immutable version
          # reference (P3). A re-run of this workflow, or a merge that did not
          # change VERSION, must not move an existing tag.
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists; nothing to do."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      # Tag protection (so this cannot be moved or deleted after the fact) is
      # configured once as a repository ruleset, not by this workflow - see
      # docs/runbook-bootstrap.md.
      - name: Tag the release
        if: steps.version.outputs.released == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Configuration state v${VERSION}"
          git push origin "v${VERSION}"
